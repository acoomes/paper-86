<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PAPER 86</title>
    <meta name="description" content="60-second drift score attack. Thread the cones, leave ink trails.">
    <meta name="theme-color" content="#f3e6c9">
    <meta property="og:title" content="PAPER 86">
    <meta property="og:description" content="60-second drift score attack. Thread the cones, leave ink trails.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://paper-86.vercel.app">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div id="hud-left">
                <div class="hud-label">TIME</div>
                <div id="time-display" class="hud-value">60.0</div>
            </div>
            <div id="hud-center">
                <div class="wordmark">PAPER 86</div>
            </div>
            <div id="hud-right">
                <div class="hud-label">SCORE</div>
                <div id="score-display" class="hud-value">0</div>
                <div class="hud-label" style="margin-top: 8px;">CLIP</div>
                <div id="combo-display" class="combo-text"></div>
            </div>
        </div>
        
        <canvas id="game-canvas"></canvas>
        
        <div id="end-screen" class="hidden">
            <div class="end-content">
                <div class="end-stamp">
                    <h1 class="end-title">TIME'S UP</h1>
                </div>
                <div class="end-scores">
                    <div class="score-row">
                        <span class="score-label">FINAL</span>
                        <span id="final-score" class="score-value">0</span>
                    </div>
                    <div class="score-row">
                        <span class="score-label">BEST</span>
                        <span id="best-score" class="score-value">0</span>
                    </div>
                </div>
                <div id="new-best-badge" class="new-best hidden">NEW BEST</div>
                <div class="end-hint">R or tap to replay</div>
            </div>
        </div>
        
        <!-- First-run instructions -->
        <div id="start-hint" class="hidden">
            <div class="start-hint-content">
                <div class="start-hint-text">ARROW KEYS STEER · SPACE TO DRIFT</div>
            </div>
        </div>
        
        <!-- Mobile controls -->
        <div id="mobile-controls" class="hidden">
            <div class="steer-controls">
                <div id="left-button" class="steer-button">LEFT</div>
                <div id="drift-button">HOLD TO DRIFT</div>
                <div id="right-button" class="steer-button">RIGHT</div>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
